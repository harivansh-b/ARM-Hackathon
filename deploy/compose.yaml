services:
  guardian:
    build:
      context: ..
      dockerfile: deploy/Dockerfile

    container_name: guardian
    restart: unless-stopped

    environment:
      GUARDIAN_SSH_ENABLED: "${GUARDIAN_SSH_ENABLED:-0}"

    ports:
      - "127.0.0.1:${GUARDIAN_PORT:-8080}:8080"

    volumes:
      - guardian_reports:/opt/guardian/person-b/reports

volumes:
  guardian_reports:
