[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[include]
files = /etc/supervisor/conf.d/*.conf

[program:guardian]
command=/opt/guardian/guardian serve --host 0.0.0.0 --port 8080
directory=/opt/guardian
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=20
user=guardian
environment=HOME="/home/guardian",PYTHONDONTWRITEBYTECODE="1",PYTHONUNBUFFERED="1"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
